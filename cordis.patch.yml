# dsh-dashboard bundle patch: contributes the plugin row into the
# host composition when this package is installed via `dsh plugin add`.
#
# The plugin is HOST-PLANE: it scans ~/.dsh/sessions offline (zstd JSONL fold
# into session×day facts), serves read-only analytics APIs plus pages/pricing
# config APIs over a webServer route, and its client half registers a
# settings.section dashboard (gridstack + ECharts cards). It must therefore
# land in the host composition (this insert), never inside an agent preset.

- insert:
    - id: dsh-dashboard
      name: '@weibaohui/dsh-dashboard'
